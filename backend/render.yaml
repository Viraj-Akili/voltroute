services:
  - type: web
    name: voltroute-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///./charging_stations.db
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
